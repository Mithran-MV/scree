# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret id the workflow asks for with `runtime.getSecret({ id })` to
# the environment variable holding its value. In a Confidential Workflow the
# Vault DON releases the value directly into the attested enclave; it is never
# in plaintext on Workflow DON nodes.
#
# TERRACE_POLICY is the owner's line, as JSON:
#   {"minHealth": 1.6, "floorPrice": 1200, "maxLift": 0.3}
# minHealth: the health they refuse to fall below. floorPrice: the price they
# refuse to be liquidated above on the crash side. maxLift: the most health they
# will buy in one lift. None of the three ever leaves the enclave.
secretsNames:
    TERRACE_POLICY:
        - SECRET_TERRACE_POLICY
